AWSTemplateFormatVersion: '2010-09-09'

Description: MediDocs storage infrastructure

Resources:

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub medidocs-reports-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: MediDocs-Reports

Outputs:

  ReportsBucketName:
    Value: !Ref ReportsBucket
    Export:
      Name: MediDocs-ReportsBucket

  ReportsBucketArn:
    Value: !GetAtt ReportsBucket.Arn
    Export:
      Name: MediDocs-ReportsBucketArn